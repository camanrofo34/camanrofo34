<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Honors &amp; Trophies Hall of Fame">
  <defs>
    <style>
      
    @keyframes waveDrift {
      0% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(-35px) translateY(-5px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes waveSlow {
      0% { transform: translateX(0px) translateY(0px) scaleY(1); }
      50% { transform: translateX(25px) translateY(6px) scaleY(1.08); }
      100% { transform: translateX(0px) translateY(0px) scaleY(1); }
    }
    @keyframes ripplePulse {
      0% { r: 10px; opacity: 0.9; stroke-width: 2.5; }
      50% { r: 75px; opacity: 0.4; stroke-width: 1.5; }
      100% { r: 140px; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes ripplePulse2 {
      0% { r: 5px; opacity: 0.8; stroke-width: 2; }
      50% { r: 90px; opacity: 0.3; stroke-width: 1.2; }
      100% { r: 180px; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes bubbleRise1 {
      0% { transform: translateY(0px) scale(0.7); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-160px) scale(1.2); opacity: 0; }
    }
    @keyframes bubbleRise2 {
      0% { transform: translateY(0px) scale(0.9); opacity: 0; }
      30% { opacity: 0.9; }
      85% { opacity: 0.5; }
      100% { transform: translateY(-210px) scale(1.4); opacity: 0; }
    }
    @keyframes dialSpinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dialSpinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes cyanGlow {
      0%, 100% { filter: drop-shadow(0 0 4px #00d2ff); opacity: 0.9; }
      50% { filter: drop-shadow(0 0 12px #00ffff); opacity: 1; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes gaugeFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .font-hud {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Roboto Mono', Consolas, monospace;
    }
    .font-p3r {
      font-family: 'Helvetica Neue', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
    }
    .font-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-reduced-motion: reduce) {
      *, .wave-anim, .ripple-anim, .bubble-anim, .dial-anim {
        animation: none !important;
      }
    }
    
    </style>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030c1d" />
      <stop offset="100%" stop-color="#081a38" />
    </linearGradient>
    <clipPath id="trophyClip">
      <rect width="900" height="260" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#trophyClip)">
    <rect width="900" height="260" fill="url(#trophyGrad)" />
    
      <g transform="translate(30, 20)">
        <polygon points="-8,0 840,0 828,42 -20,42" fill="#051c3c" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1" transform="skewX(-14)" />
        <rect x="0" y="8" width="6" height="26" fill="#00d2ff" />
        <text x="18" y="26" class="font-p3r" font-size="14.5" fill="#ffffff" letter-spacing="0.5">🏆 2x ICPC Regional Finalist</text>
        <text x="360" y="26" class="font-hud" font-size="11.5" font-weight="700" fill="#e6ff00">[2024 &amp; 2026]</text>
        <text x="490" y="26" class="font-hud" font-size="11.5" fill="#75c2ff">ICPC South America–North</text>
      </g>
        
      <g transform="translate(30, 66)">
        <polygon points="-8,0 840,0 828,42 -20,42" fill="#051c3c" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1" transform="skewX(-14)" />
        <rect x="0" y="8" width="6" height="26" fill="#00d2ff" />
        <text x="18" y="26" class="font-p3r" font-size="14.5" fill="#ffffff" letter-spacing="0.5">🥇 Academic Honor Scholarship</text>
        <text x="360" y="26" class="font-hud" font-size="11.5" font-weight="700" fill="#e6ff00">[2025-20 &amp; 2026-10]</text>
        <text x="490" y="26" class="font-hud" font-size="11.5" fill="#75c2ff">Universidad Pontificia Bolivariana</text>
      </g>
        
      <g transform="translate(30, 112)">
        <polygon points="-8,0 840,0 828,42 -20,42" fill="#051c3c" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1" transform="skewX(-14)" />
        <rect x="0" y="8" width="6" height="26" fill="#00d2ff" />
        <text x="18" y="26" class="font-p3r" font-size="14.5" fill="#ffffff" letter-spacing="0.5">🔬 RedColSi National Finalist</text>
        <text x="360" y="26" class="font-hud" font-size="11.5" font-weight="700" fill="#e6ff00">[2026]</text>
        <text x="490" y="26" class="font-hud" font-size="11.5" fill="#75c2ff">RedColSi / SIINFO</text>
      </g>
        
      <g transform="translate(30, 158)">
        <polygon points="-8,0 840,0 828,42 -20,42" fill="#051c3c" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1" transform="skewX(-14)" />
        <rect x="0" y="8" width="6" height="26" fill="#00d2ff" />
        <text x="18" y="26" class="font-p3r" font-size="14.5" fill="#ffffff" letter-spacing="0.5">🎖️ EPAM Academy LatAm #13</text>
        <text x="360" y="26" class="font-hud" font-size="11.5" font-weight="700" fill="#e6ff00">[2025]</text>
        <text x="490" y="26" class="font-hud" font-size="11.5" fill="#75c2ff">EPAM Systems</text>
      </g>
        
      <g transform="translate(30, 204)">
        <polygon points="-8,0 840,0 828,42 -20,42" fill="#051c3c" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1" transform="skewX(-14)" />
        <rect x="0" y="8" width="6" height="26" fill="#00d2ff" />
        <text x="18" y="26" class="font-p3r" font-size="14.5" fill="#ffffff" letter-spacing="0.5">☁️ AWS &amp; GCP Certified</text>
        <text x="360" y="26" class="font-hud" font-size="11.5" font-weight="700" fill="#e6ff00">[2025 - 2026]</text>
        <text x="490" y="26" class="font-hud" font-size="11.5" fill="#75c2ff">AWS &amp; Google Cloud</text>
      </g>
        
    <rect width="900" height="260" fill="none" stroke="#00d2ff" stroke-opacity="0.3" stroke-width="1.2" rx="10" />
  </g>
</svg>
