<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="85%" stop-color="#0e2347" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Base Card Background with subtle rounded corners -->
  <rect width="900" height="220" rx="14" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="220" stroke-dasharray="4 6" />
    <line x1="250" y1="0" x2="250" y2="220" stroke-dasharray="4 6" />
    <line x1="450" y1="0" x2="450" y2="220" stroke-dasharray="4 6" />
    <line x1="650" y1="0" x2="650" y2="220" stroke-dasharray="4 6" />
    <line x1="800" y1="0" x2="800" y2="220" stroke-dasharray="4 6" />
    <line x1="0" y1="55" x2="900" y2="55" stroke-dasharray="4 6" />
    <line x1="0" y1="110" x2="900" y2="110" stroke-dasharray="4 6" />
    <line x1="0" y1="165" x2="900" y2="165" stroke-dasharray="4 6" />
  </g>

  <!-- Flowing Aesthetic Waves -->
  <path d="M0 135 C 180 100, 320 185, 520 145 C 720 105, 820 170, 900 140 L 900 220 L 0 220 Z" fill="url(#waveGrad2)" />
  <path d="M0 160 C 220 120, 380 200, 580 165 C 750 135, 840 180, 900 165 L 900 220 L 0 220 Z" fill="url(#waveGrad1)" />

  <!-- Top Accent Glowing Line -->
  <line x1="0" y1="1" x2="900" y2="1" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- Corner Glowing Tech Accents -->
  <circle cx="35" cy="35" r="3" fill="#38bdf8" opacity="0.7" filter="url(#glow)" />
  <circle cx="865" cy="35" r="3" fill="#38bdf8" opacity="0.7" filter="url(#glow)" />
  <text x="50" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" opacity="0.85">&lt;SOFTWARE ENGINEER /&gt;</text>
  <text x="850" y="38" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" opacity="0.85">UPB • COLOMBIA 🇨🇴</text>

  <!-- Main Name Title -->
  <text x="450" y="105" text-anchor="middle" fill="url(#cyanText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="1">
    CAMILO ANDRÉS RODRÍGUEZ FORERO
  </text>

  <!-- Subtitle with Badges Accent -->
  <text x="450" y="142" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.5">
    Full-Stack &amp; Mobile Engineer • Java &amp; Spring Boot • 2x ICPC Regional Finalist
  </text>

  <!-- Tagline pills -->
  <g transform="translate(450, 182)">
    <!-- Pill 1: Cloud -->
    <rect x="-240" y="-14" width="130" height="24" rx="12" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="0.8" />
    <text x="-175" y="2" text-anchor="middle" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">☁️ AWS &amp; GCP</text>

    <!-- Pill 2: ICPC -->
    <rect x="-95" y="-14" width="190" height="24" rx="12" fill="#0369a1" fill-opacity="0.35" stroke="#f59e0b" stroke-width="0.8" />
    <text x="0" y="2" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🏆 2x ICPC Finalist (2024 &amp; 2026)</text>

    <!-- Pill 3: Research -->
    <rect x="110" y="-14" width="135" height="24" rx="12" fill="#0369a1" fill-opacity="0.35" stroke="#10b981" stroke-width="0.8" />
    <text x="177" y="2" text-anchor="middle" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔬 RedColSi 2026</text>
  </g>

  <!-- Card Border -->
  <rect width="900" height="220" rx="14" fill="none" stroke="#1e3a5f" stroke-width="1.2" />
</svg>