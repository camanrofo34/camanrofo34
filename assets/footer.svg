<svg width="100%" height="90" viewBox="0 0 900 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="footWave1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="footWave2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="900" height="90" rx="12" fill="url(#footGrad)" />

  <!-- Inverted flowing waves -->
  <path d="M0 0 L 900 0 L 900 40 C 750 70, 600 20, 420 50 C 240 80, 100 30, 0 55 Z" fill="url(#footWave2)" />
  <path d="M0 0 L 900 0 L 900 25 C 780 50, 640 15, 450 40 C 260 65, 120 20, 0 35 Z" fill="url(#footWave1)" />

  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
    Crafted with precision &bull; Camilo Andrés Rodríguez Forero &bull; Bucaramanga, Colombia
  </text>

  <!-- Border -->
  <rect width="900" height="90" rx="12" fill="none" stroke="#1e3a5f" stroke-width="1.2" />
</svg>