<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="Honors &amp; Trophies Showcase">
  <defs>
    <style>
      
    @keyframes waveDrift {
      0% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(-35px) translateY(-5px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes waveSlow {
      0% { transform: translateX(0px) translateY(0px) scaleY(1); }
      50% { transform: translateX(25px) translateY(6px) scaleY(1.08); }
      100% { transform: translateX(0px) translateY(0px) scaleY(1); }
    }
    @keyframes bubbleRise1 {
      0% { transform: translateY(0px) scale(0.7); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-160px) scale(1.2); opacity: 0; }
    }
    @keyframes bubbleRise2 {
      0% { transform: translateY(0px) scale(0.9); opacity: 0; }
      30% { opacity: 0.9; }
      85% { opacity: 0.5; }
      100% { transform: translateY(-210px) scale(1.4); opacity: 0; }
    }
    @keyframes cyanGlow {
      0%, 100% { filter: drop-shadow(0 0 4px #00d2ff); opacity: 0.9; }
      50% { filter: drop-shadow(0 0 12px #00ffff); opacity: 1; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .font-hud {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Roboto Mono', Consolas, monospace;
    }
    .font-p3r {
      font-family: 'Helvetica Neue', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
    }
    .font-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-reduced-motion: reduce) {
      *, .wave-anim, .bubble-anim {
        animation: none !important;
      }
    }
    
    </style>
  </defs>

  <g>
    
      <g transform="translate(16, 10)">
        <!-- Strictly positive coordinates: Left edge is x=8 > 0 -->
        <polygon points="18,0 864,0 854,42 8,42" fill="#041936" fill-opacity="0.85" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1" />
        <rect x="18" y="8" width="5" height="26" fill="#00d2ff" />
        <g transform="translate(30, 11) scale(0.9)">
          <path d="M4,3 H16 V8 C16,11.3 13.3,14 10,14 C6.7,14 4,11.3 4,8 Z" fill="none" stroke="#e6ff00" stroke-width="2" />
          <path d="M4,5 H1 C1,7.2 2,9 4,9 M16,5 H19 C19,7.2 18,9 16,9" fill="none" stroke="#00d2ff" stroke-width="1.8" />
          <line x1="10" y1="14" x2="10" y2="18" stroke="#e6ff00" stroke-width="2" />
          <line x1="6" y1="18" x2="14" y2="18" stroke="#e6ff00" stroke-width="2" />
        </g>
        <text x="56" y="26" class="font-p3r" font-size="14.5" fill="#ffffff" letter-spacing="0.5">2x ICPC Regional Finalist</text>
        <text x="380" y="26" class="font-hud" font-size="11.5" font-weight="700" fill="#e6ff00">[2024 &amp; 2026]</text>
        <text x="510" y="26" class="font-hud" font-size="11.5" fill="#75c2ff">ICPC South America–North</text>
      </g>
        
      <g transform="translate(16, 58)">
        <!-- Strictly positive coordinates: Left edge is x=8 > 0 -->
        <polygon points="18,0 864,0 854,42 8,42" fill="#041936" fill-opacity="0.85" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1" />
        <rect x="18" y="8" width="5" height="26" fill="#00d2ff" />
        <g transform="translate(30, 11) scale(0.9)">
          <polygon points="10,1 12.5,7 19,7.5 14,12 15.5,18.5 10,15 4.5,18.5 6,12 1,7.5 7.5,7" fill="#e6ff00" stroke="#00ffff" stroke-width="1" />
        </g>
        <text x="56" y="26" class="font-p3r" font-size="14.5" fill="#ffffff" letter-spacing="0.5">Academic Honor Scholarship</text>
        <text x="380" y="26" class="font-hud" font-size="11.5" font-weight="700" fill="#e6ff00">[2025-20 &amp; 2026-10]</text>
        <text x="510" y="26" class="font-hud" font-size="11.5" fill="#75c2ff">Universidad Pontificia Bolivariana</text>
      </g>
        
      <g transform="translate(16, 106)">
        <!-- Strictly positive coordinates: Left edge is x=8 > 0 -->
        <polygon points="18,0 864,0 854,42 8,42" fill="#041936" fill-opacity="0.85" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1" />
        <rect x="18" y="8" width="5" height="26" fill="#00d2ff" />
        <g transform="translate(30, 11) scale(0.9)">
          <ellipse cx="10" cy="10" rx="8" ry="3" fill="none" stroke="#00d2ff" stroke-width="1.5" transform="rotate(30 10 10)" />
          <ellipse cx="10" cy="10" rx="8" ry="3" fill="none" stroke="#00d2ff" stroke-width="1.5" transform="rotate(-30 10 10)" />
          <circle cx="10" cy="10" r="2.2" fill="#00ffff" />
        </g>
        <text x="56" y="26" class="font-p3r" font-size="14.5" fill="#ffffff" letter-spacing="0.5">RedColSi National Finalist</text>
        <text x="380" y="26" class="font-hud" font-size="11.5" font-weight="700" fill="#e6ff00">[2026]</text>
        <text x="510" y="26" class="font-hud" font-size="11.5" fill="#75c2ff">RedColSi / SIINFO</text>
      </g>
        
  </g>
</svg>
